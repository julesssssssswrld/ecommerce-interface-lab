<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - NiggsShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tablet.css">
    <link rel="stylesheet" href="desktop.css">
</head>

<body>

    <header>
        <h1>NiggsShop</h1>
        <nav>
            <ul>
                <li><a href="landing.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li class="nav-auth"><a href="cart.html">Cart</a></li>
                <li class="nav-auth"><a href="account.html" id="current_page">My Account</a></li>
                <li class="nav-guest"><a href="signup.html">Sign Up</a></li>
                <li class="nav-guest"><a href="login.html">Login</a></li>
                <li class="nav-auth"><a href="#" id="nav-logout-link" onclick="logoutUser(); return false;">Logout</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <header>
            <h2 id="account-welcome">Welcome, Guest</h2>
            <nav>
                <ul>
                    <li><a href="#orders">Order History</a></li>
                    <li><a href="#settings">Profile Settings</a></li>
                </ul>
            </nav>
        </header>

        <hr>

        <section id="orders">
            <h3>Order History</h3>
            <div id="order-list">
                <p>Loading orders...</p>
            </div>
        </section>

        <hr>

        <section id="settings">
            <h3>Profile Settings</h3>
            <form id="profile-form">
                <label>Username: <br><input type="text" id="profile-username" readonly></label><br><br>
                <label>Role: <br><input type="text" id="profile-role" readonly></label><br><br>
            </form>
        </section>
    </main>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await requireAuth();
            if (!user) return;
            updateNavAuth();

            // Welcome header with role badge
            document.getElementById('account-welcome').innerHTML =
                `Welcome, ${user.username} <span class="role-badge">${user.role}</span>`;

            // Profile settings — actual credentials
            document.getElementById('profile-username').value = user.username;
            document.getElementById('profile-role').value = user.role;

            // Load order history from API
            loadOrders();
        });

        async function loadOrders() {
            const orderList = document.getElementById('order-list');
            try {
                const response = await fetch(`${API_BASE}/api/v1/orders`, {
                    credentials: 'include'
                });
                if (response.status === 403) {
                    // Non-admin users can't list all orders — show a message
                    orderList.innerHTML = '<p>No order history yet. Place an order from your <a href="cart.html">cart</a>!</p>';
                    return;
                }
                if (!response.ok) {
                    orderList.innerHTML = '<p>No order history yet.</p>';
                    return;
                }
                const orders = await response.json();
                if (orders.length === 0) {
                    orderList.innerHTML = '<p>No order history yet. Place an order from your <a href="cart.html">cart</a>!</p>';
                    return;
                }
                orderList.innerHTML = '<ul>' + orders.map(order => `
                    <li>
                        <details>
                            <summary>Order #${order.id} — ${new Date(order.orderDate).toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' })}</summary>
                            <dl>
                                <dt>Customer</dt>
                                <dd>${order.customerName}</dd>
                                <dt>Email</dt>
                                <dd>${order.customerEmail}</dd>
                                <dt>Items</dt>
                                <dd>${order.orderItems.map(i => `${i.product?.name || 'Product'} × ${i.quantity}`).join(', ')}</dd>
                                <dt>Total</dt>
                                <dd>₱${Number(order.totalAmount).toLocaleString('en-PH')}</dd>
                            </dl>
                        </details>
                    </li>
                `).join('') + '</ul>';
            } catch (e) {
                orderList.innerHTML = '<p>No order history yet.</p>';
            }
        }
    </script>

</body>

</html>
