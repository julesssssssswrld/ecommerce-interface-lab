<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - NiggsShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tablet.css">
    <link rel="stylesheet" href="desktop.css">
</head>

<body>

    <header>
        <h1>NiggsShop</h1>
        <nav>
            <ul>
                <li><a href="landing.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li class="nav-auth"><a href="cart.html" id="current_page">Cart</a></li>
                <li class="nav-auth"><a href="account.html">My Account</a></li>
                <li class="nav-guest"><a href="signup.html">Sign Up</a></li>
                <li class="nav-guest"><a href="login.html">Login</a></li>
                <li class="nav-auth"><a href="#" id="nav-logout-link" onclick="logoutUser(); return false;">Logout</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <h2>Checkout</h2>

        <div class="checkout-layout">

            <section>
                <h3>Shipping Information</h3>
                <form id="checkout-form">
                    <fieldset>
                        <label>Shipping Address</label>
                        <label>Full Name: <br><input type="text" id="checkout-name" name="fullname" required></label><br><br>
                        <label>Email: <br><input type="email" id="checkout-email" name="email" required></label><br><br>
                        <label>Street Address: <br><input type="text" name="street" required></label><br><br>
                        <label>City: <br><input type="text" name="city" required></label><br><br>
                        <label>Zip Code: <br><input type="text" name="zip" required></label><br><br>
                    </fieldset>

                    <hr>

                    <h3>Payment Method</h3>
                    <label><input type="radio" name="payment" value="gcash" checked> GCash</label><br>
                    <label><input type="radio" name="payment" value="cod"> Cash on Delivery</label><br>
                    <label><input type="radio" name="payment" value="creditcard"> Credit Card</label><br>
                    <label><input type="radio" name="payment" value="paypal"> PayPal</label><br><br>
                </form>
            </section>

            <aside>
                <h3>Order Summary</h3>
                <div id="checkout-items">
                    <p>Loading cart...</p>
                </div>
                <hr>
                <p>Subtotal: <span id="checkout-subtotal">₱0</span></p>
                <p>Shipping: ₱150</p>
                <p><b>Total: <span id="checkout-total">₱0</span></b></p>
                <br>
                <button type="button" id="place-order-btn">Place Order</button>
            </aside>

        </div>
    </main>

    <script src="auth.js"></script>
    <script src="cart.js"></script>
    <script>
        let cartItems = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await requireAuth();
            if (!user) return;
            updateNavAuth();

            // Load cart items into checkout summary
            const cart = await fetchCart();
            cartItems = cart.items || [];

            const itemsDiv = document.getElementById('checkout-items');
            if (cartItems.length === 0) {
                itemsDiv.innerHTML = '<p>Your cart is empty. <a href="products.html">Add products</a> first.</p>';
                document.getElementById('place-order-btn').disabled = true;
                return;
            }

            itemsDiv.innerHTML = cartItems.map(item =>
                `<p>${item.product.name} × ${item.quantity} — ₱${(item.product.price * item.quantity).toLocaleString('en-PH')}</p>`
            ).join('');

            const total = cartTotal(cartItems);
            document.getElementById('checkout-subtotal').textContent = `₱${total.toLocaleString('en-PH')}`;
            document.getElementById('checkout-total').textContent = `₱${(total + 150).toLocaleString('en-PH')}`;

            // Place order handler
            document.getElementById('place-order-btn').addEventListener('click', placeOrder);
        });

        async function placeOrder() {
            const name = document.getElementById('checkout-name').value.trim();
            const email = document.getElementById('checkout-email').value.trim();

            if (!name || !email) {
                showToast('Please fill in your name and email.', 'error');
                return;
            }

            await initCsrf();
            const orderPayload = {
                customerName: name,
                customerEmail: email,
                items: cartItems.map(item => ({
                    productId: item.product.id,
                    quantity: item.quantity
                }))
            };

            const response = await authFetch(`${API_BASE}/api/v1/orders`, {
                method: 'POST',
                body: JSON.stringify(orderPayload)
            });

            if (response.ok || response.status === 201) {
                await clearCart();
                showToast('Order placed successfully!', 'success');
                setTimeout(() => { window.location.href = 'account.html'; }, 2000);
            } else {
                await showResponseError(response, 'Failed to place order.');
            }
        }
    </script>

</body>

</html>
