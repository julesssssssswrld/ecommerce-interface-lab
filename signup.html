    <main>
        <h2>Create an Account</h2>
        <form>
            <label>First Name: <br><input type="text" name="firstname" required></label><br><br>
            <label>Last Name: <br><input type="text" name="lastname" required></label><br><br>
            <label>Email: <br><input type="email" name="email" required></label><br><br>
            <label>Password: <br><input type="password" name="password" required></label><br><br>
            <label>Confirm Password: <br><input type="password" name="confirm_password" required></label><br><br>
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="account.html">Log in here</a></p>
    </main>
