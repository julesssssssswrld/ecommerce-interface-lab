<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - NiggsShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tablet.css">
    <link rel="stylesheet" href="desktop.css">
</head>

<body>

    <header>
        <h1>NiggsShop</h1>
        <nav>
            <ul>
                <li><a href="landing.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="account.html">My Account</a></li>
                <li><a href="signup.html" id="current_page">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <h2>Create an Account</h2>
        <form id="signup-form">
            <label>Username:<br><input type="text" id="signup-username" name="username" required></label><br><br>
            <label>Password:<br><input type="password" id="signup-password" name="password" required></label><br><br>
            <label>Confirm Password:<br><input type="password" id="signup-confirm-password" name="confirm_password" required></label><br><br>
            <label>Role:<br>
                <select id="signup-role" name="role">
                    <option value="USER">USER</option>
                    <option value="SELLER">SELLER</option>
                </select>
            </label><br><br>
            <button type="submit">Register</button>
        </form>
        <div id="signup-error" style="display:none;color:#b00020;margin-top:1rem;"></div>
        <div id="signup-success" style="display:none;color:#007700;margin-top:1rem;"></div>
        <p>Already have an account? <a href="login.html">Log in here</a></p>
    </main>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateNavAuth();
            document.getElementById('signup-form').addEventListener('submit', async (event) => {
                event.preventDefault();
                document.getElementById('signup-error').style.display = 'none';
                document.getElementById('signup-success').style.display = 'none';

                const username = document.getElementById('signup-username').value.trim();
                const password = document.getElementById('signup-password').value;
                const confirmPassword = document.getElementById('signup-confirm-password').value;
                const role = document.getElementById('signup-role').value;

                if (password !== confirmPassword) {
                    const errorEl = document.getElementById('signup-error');
                    errorEl.textContent = 'Passwords do not match.';
                    errorEl.style.display = 'block';
                    return;
                }

                const response = await registerUser(username, password, role);
                if (response.status === 201) {
                    const successEl = document.getElementById('signup-success');
                    successEl.textContent = 'Registration successful. Redirecting to login...';
                    successEl.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                    return;
                }

                const errorEl = document.getElementById('signup-error');
                try {
                    const payload = await response.json();
                    errorEl.textContent = payload.message || 'Registration failed. Please try again.';
                } catch (e) {
                    errorEl.textContent = 'Registration failed. Please try again.';
                }
                errorEl.style.display = 'block';
            });
        });
    </script>

</body>

</html>
