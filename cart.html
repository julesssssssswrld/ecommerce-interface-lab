<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - NiggsShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>NiggsShop</h1>
        <nav>
            <ul>
                <li><a href="landing.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html" id="current_page">Cart</a></li>
                <li><a href="account.html">My Account</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <h2>Cart</h2>

        <ul>
            <li>
                <img class="cart_img" src="" alt="Airpods">
                <h3>Apple Airpods Pro 2</h3>
                <p class="price">10,990</p>
                <label>Qty: <input type="number" value="1" min="1"></label>
            </li>
            <li>
                <img class="cart_img" src="" alt="Apple Watch">
                <h3>Apple Watch (Cherry Ultra Edition)</h3>
                <p class="price">69,420</p>
                <label>Qty: <input type="number" value="1" min="1"></label>
            </li>
            <li>
                <img class="cart_img" src="" alt="Case">
                <h3>Phone Case</h3>
                <p class="price">149</p>
                <label>Qty: <input type="number" value="2" min="1"></label>
            </li>
        </ul>

        <hr>

        <section>
            <h3>Order Summary</h3>
            <p>Subtotal: ₱80,708</p>
            <p>Shipping: ₱150</p>
            <p><b>Total: ₱80,858</b></p>
            <a href="checkout.html" class="btn">Proceed to Checkout</a>
        </section>

        <section class="empty-cart"></section>

    </main>

</body>

</html>
