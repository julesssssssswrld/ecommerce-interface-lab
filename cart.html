<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - NiggsShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tablet.css">
    <link rel="stylesheet" href="desktop.css">
</head>

<body>

    <header>
        <h1>NiggsShop</h1>
        <nav>
            <ul>
                <li><a href="landing.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li class="nav-auth"><a href="cart.html" id="current_page">Cart</a></li>
                <li class="nav-auth"><a href="account.html">My Account</a></li>
                <li class="nav-guest"><a href="signup.html">Sign Up</a></li>
                <li class="nav-guest"><a href="login.html">Login</a></li>
                <li class="nav-auth"><a href="#" id="nav-logout-link" onclick="logoutUser(); return false;">Logout</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <h2>Cart</h2>

        <!-- Dynamically populated from the Cart API -->
        <ul class="cart-list" id="cart-items"></ul>

        <hr>

        <section id="cart-summary" style="display:none;">
            <h3>Order Summary</h3>
            <p>Subtotal: <span id="cart-subtotal">₱0</span></p>
            <p>Shipping: ₱150</p>
            <p><b>Total: <span id="cart-total">₱0</span></b></p>
            <a href="checkout.html" class="btn">Proceed to Checkout</a>
        </section>

        <p class="empty-state" id="empty-cart-msg" style="display:none;">
            Your cart is empty! <a href="products.html">Browse products</a> to add items.
        </p>
    </main>

    <script src="auth.js"></script>
    <script src="cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await requireAuth();
            if (!user) return;
            updateNavAuth();
            await renderCartPage();
        });
    </script>

</body>

</html>
